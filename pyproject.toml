[project]
name = "gridworks-ingester"
version = "0.1.0"
description = "Data ingester for GridWorks telemetry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "aiomqtt>=2.0.0",
    "asyncpg>=0.29.0",
    "aioboto3>=12.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "gridworks-proactor>=4.1.13"
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
gridworks-ingester = "gridworks_ingester.cli:app"
gwi = "gridworks_ingester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/gwi"]